<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Your Club Academy</title>
  <meta name="description" content="Build Your Club Academy — interactive demos for nonprofit clubs and organizations.">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #DBEAFE; /* light blue */
      color: #1E3A8A;      /* dark blue */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 4rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      max-width: 720px;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1E3A8A;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-size: clamp(1rem, 2.2vw, 1.125rem);
      color: #1E40AF;
      opacity: 0.85;
      font-weight: 400;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
      max-width: 520px;
    }

    .demo-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      width: 100%;
      padding: 1.25rem 1.5rem;
      background: #1E3A8A; /* dark blue */
      color: #FFFFFF;
      text-decoration: none;
      font: inherit;
      font-size: 1.125rem;
      font-weight: 600;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 4px rgba(30, 58, 138, 0.15);
    }

    .demo-button:hover,
    .demo-button:focus-visible {
      background: #1E40AF;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(30, 58, 138, 0.3);
      outline: none;
    }

    .demo-button:focus-visible {
      border-color: #FBBF24;
    }

    .demo-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(30, 58, 138, 0.2);
    }

    .demo-button[disabled],
    .demo-button.coming-soon {
      background: #93C5FD;
      color: #1E3A8A;
      cursor: not-allowed;
      box-shadow: none;
    }

    .demo-button[disabled]:hover,
    .demo-button.coming-soon:hover,
    .demo-button[disabled]:focus-visible,
    .demo-button.coming-soon:focus-visible {
      background: #93C5FD;
      transform: none;
      box-shadow: none;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: #1E40AF;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Build Your Club Academy</h1>
    <p class="subtitle">Interactive demos for starting and running your organization.</p>
  </header>

  <nav class="demo-grid" aria-label="Demo applications">
    <a class="demo-button" href="https://501c3.buildyourclubacademy.org/501c3-Formation-Assistant/">
      <span>501(c)(3) Formation Assistant</span>
    </a>

    <a class="demo-button" href="https://audit.buildyourclubacademy.org">
      <span>Nonprofit Operations Audit</span>
    </a>

    <a class="demo-button" href="https://board-management.buildyourclubacademy.org">
      <span>Nonprofit Board Management</span>
    </a>

    <a class="demo-button" href="https://fundraising.buildyourclubacademy.org">
      <span>Nonprofit Fundraising &amp; Development</span>
    </a>

    <button class="demo-button coming-soon" type="button" disabled aria-disabled="true">
      <span>Nonprofit AI Automation</span>
      <span class="tag">Coming Soon</span>
    </button>
  </nav>

  <footer>
    &copy; Build Your Club Academy
  </footer>
</body>
</html>
